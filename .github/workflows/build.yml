name: Build Custom Linux OS (Ultra-Light Windows Style v7)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring wget
          wget http://ftp.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo apt-get install -y ./live-build_20230502_all.deb

      - name: Setup live-build configuration
        run: |
          mkdir -p build-dir
          cd build-dir
          sudo lb config \
            --distribution trixie \
            --architecture amd64 \
            --archive-areas "main contrib non-free-firmware" \
            --bootappend-live "boot=live components locales=ja_JP.UTF-8 keyboard-layouts=jp quiet splash plymouth.ignore-serial-consoles" \
            --security false

          # ---------------------------------------------------------
          # 1. パッケージリスト（wget, curlを追加）
          # ---------------------------------------------------------
          sudo mkdir -p config/package-lists
          echo "linux-image-amd64 live-boot live-config systemd-sysv task-lxqt-desktop firefox-esr mousepad network-manager isolinux grub-pc-bin grub-efi-amd64-bin \
          fonts-noto-cjk fonts-noto-color-emoji fcitx5 fcitx5-mozc fcitx5-config-qt \
          ufw apparmor apparmor-profiles picom \
          cpu-x hardinfo glmark2 mangohud sysbench zenity wget curl \
          gnome-software gnome-software-plugin-flatpak flatpak \
          plymouth plymouth-themes papirus-icon-theme gsmartcontrol \
          calamares calamares-settings-debian qterminal" | sudo tee config/package-lists/my-apps.list.chroot > /dev/null

          # ---------------------------------------------------------
          # 2. アプリストア（Flathub）の初期設定
          # ---------------------------------------------------------
          sudo mkdir -p config/hooks/normal
          cat << 'EOF' | sudo tee config/hooks/normal/01-setup-flathub.hook.chroot > /dev/null
          #!/bin/sh
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          EOF
          sudo chmod +x config/hooks/normal/01-setup-flathub.hook.chroot

          # ---------------------------------------------------------
          # 3. 垂直同期（ティアリング防止）の自動起動設定
          # ---------------------------------------------------------
          sudo mkdir -p config/includes.chroot/etc/skel/.config/autostart
          echo "[Desktop Entry]
          Type=Application
          Exec=picom --vsync
          Hidden=false
          NoDisplay=false
          Name=Picom VSync" | sudo tee config/includes.chroot/etc/skel/.config/autostart/picom.desktop > /dev/null

          # ---------------------------------------------------------
          # 4. 自作プログラム群
          # ---------------------------------------------------------
          sudo mkdir -p config/includes.chroot/usr/local/bin
          sudo mkdir -p config/includes.chroot/etc/skel/Desktop

          # 🎁 【新機能】かんたんアプリ追加ツール
          cat << 'EOF' | sudo tee config/includes.chroot/usr/local/bin/my-app-installer.sh > /dev/null
          #!/bin/bash
          CHOICE=$(zenity --list --title="かんたんアプリ追加" --text="インストールしたいアプリを選んでください:\n(※インターネット接続が必要です)" --radiolist --column="選択" --column="アプリ名" TRUE "Google Chrome (定番ブラウザ)" FALSE "Discord (チャット・通話)" FALSE "Visual Studio Code (プログラミング)" FALSE "Spotify (音楽)")
          [ -z "$CHOICE" ] && exit

          qterminal -e bash -c "
          echo '⏳ 【 $CHOICE 】 をダウンロード＆インストールしています...'
          echo '※PCの性能や回線によっては数分かかります。そのままお待ちください。'
          sudo apt-get update -y > /dev/null
          
          if [ \"$CHOICE\" = \"Google Chrome (定番ブラウザ)\" ]; then
              wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo apt-get install -y /tmp/chrome.deb
          elif [ \"$CHOICE\" = \"Discord (チャット・通話)\" ]; then
              flatpak install -y flathub com.discordapp.Discord
          elif [ \"$CHOICE\" = \"Visual Studio Code (プログラミング)\" ]; then
              wget -qO /tmp/vscode.deb 'https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64'
              sudo apt-get install -y /tmp/vscode.deb
          elif [ \"$CHOICE\" = \"Spotify (音楽)\" ]; then
              flatpak install -y flathub com.spotify.Client
          fi
          
          echo ''
          echo '✅ インストールが完了しました！'
          echo '画面左下のスタートメニューから起動できます。'
          echo '(この画面はエンターキーを押すと閉じます)'
          read
          "
          EOF
          sudo chmod +x config/includes.chroot/usr/local/bin/my-app-installer.sh

          # 🏆 CPUベンチマーク
          cat << 'EOF' | sudo tee config/includes.chroot/usr/local/bin/my-bench.sh > /dev/null
          #!/bin/bash
          MODE=$(zenity --list --title="CPUベンチマーク" --text="測定モードを選択してください:" --radiolist --column="選択" --column="モード" TRUE "マルチコア (全スレッド)" FALSE "シングルコア (単体性能)")
          [ -z "$MODE" ] && exit
          THREADS=$(nproc); PRIME_LIMIT=20000
          if [ "$MODE" == "シングルコア (単体性能)" ]; then THREADS=1; PRIME_LIMIT=10000; fi
          zenity --info --title="準備完了" --text="[$MODE] で測定を開始します。" --timeout=3
          sysbench cpu --cpu-max-prime=$PRIME_LIMIT --threads=$THREADS run | tee /tmp/bench.log | zenity --progress --title="測定中..." --text="計算中..." --pulsate --auto-close --no-cancel
          SCORE=$(grep "events per second:" /tmp/bench.log | awk '{print $4}')
          zenity --info --title="測定完了！" --text="🏆 あなたのCPUスコア\nモード: $MODE\nスコア: 【 $(printf "%.0f" $SCORE) 】"
          EOF
          sudo chmod +x config/includes.chroot/usr/local/bin/my-bench.sh

          # 🎮 GPUベンチマーク
          cat << 'EOF' | sudo tee config/includes.chroot/usr/local/bin/my-gpu-bench.sh > /dev/null
          #!/bin/bash
          RES=$(zenity --list --title="GPU設定 (1/2)" --text="解像度を選択:" --radiolist --column="選択" --column="解像度" TRUE "1280x720" FALSE "1920x1080" FALSE "フルスクリーン")
          [ -z "$RES" ] && exit
          QUAL=$(zenity --list --title="GPU設定 (2/2)" --text="画質を選択:" --radiolist --column="選択" --column="画質" TRUE "標準設定 (Low)" FALSE "高画質設定 (High)")
          [ -z "$QUAL" ] && exit
          CMD="glmark2"
          if [ "$RES" == "フルスクリーン" ]; then CMD="$CMD --fullscreen"; else CMD="$CMD -s $RES"; fi
          if [ "$QUAL" == "高画質設定 (High)" ]; then CMD="$CMD --visual-config samples=4"; fi
          $CMD > /tmp/gpu_bench.log 2>&1
          GPU_SCORE=$(grep "glmark2 Score" /tmp/gpu_bench.log | awk '{print $NF}')
          zenity --info --title="測定完了！" --text="🎮 GPUスコア: 【 $GPU_SCORE 】"
          EOF
          sudo chmod +x config/includes.chroot/usr/local/bin/my-gpu-bench.sh

          # 🔄 システム更新
          cat << 'EOF' | sudo tee config/includes.chroot/usr/local/bin/my-update.sh > /dev/null
          #!/bin/bash
          zenity --question --title="システム更新" --text="最新の更新をインストールしますか？" || exit
          qterminal -e bash -c "sudo apt-get update && sudo apt-get upgrade -y; echo '✅ 完了しました！'; read"
          EOF
          sudo chmod +x config/includes.chroot/usr/local/bin/my-update.sh

          # --- デスクトップのショートカット作成 ---
          
          # ★新しいアイコン（アプリ追加）
          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/App-Installer.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=かんたんアプリ追加
          Exec=/usr/local/bin/my-app-installer.sh
          Icon=system-software-install
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/App-Installer.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/Settings.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=設定 (Settings)
          Exec=lxqt-config
          Icon=preferences-system
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/Settings.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/Update.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=システム更新
          Exec=/usr/local/bin/my-update.sh
          Icon=system-software-update
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/Update.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/Install.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=このOSをPCにインストール
          Exec=sudo calamares
          Icon=drive-harddisk
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/Install.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/CPU-Bench.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CPUベンチマーク
          Exec=/usr/local/bin/my-bench.sh
          Icon=utilities-system-monitor
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/CPU-Bench.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/GPU-Bench.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=GPUベンチマーク
          Exec=/usr/local/bin/my-gpu-bench.sh
          Icon=video-display
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/GPU-Bench.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/CPU-X.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=システム情報 (CPU-X)
          Exec=cpu-x
          Icon=cpu-x
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/CPU-X.desktop

          cat << 'EOF' | sudo tee config/includes.chroot/etc/skel/Desktop/DiskInfo.desktop > /dev/null
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=ディスク診断 (DiskInfo)
          Exec=gsmartcontrol
          Icon=gsmartcontrol
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/DiskInfo.desktop

      - name: Build ISO
        run: |
          cd build-dir
          sudo lb build

      - name: Upload ISO to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: My-UltraLight-WinStyle-v7-Debian13
          path: build-dir/*.iso
